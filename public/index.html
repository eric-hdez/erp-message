<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sit With It</title>
<style>
  :root { --bg:#f4f1ec; --fg:#2b2b2b; --accent:#5b7c75; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d2321; --fg:#e8e6e1; --accent:#8fb3aa; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:2rem; padding:1.5rem; background:var(--bg); color:var(--fg);
         font-family: Georgia, serif; text-align:center; }
  #msg { font-size:1.6rem; line-height:1.45; max-width:30rem; min-height:6rem; margin:0; }
  button { font:inherit; font-size:1.1rem; padding:.9rem 2rem; border-radius:999px; border:2px solid var(--accent);
           background:transparent; color:var(--accent); cursor:pointer; }
  button:hover, button:focus-visible { background:var(--accent); color:var(--bg); }
</style>
</head>
<body>
  <p id="msg">Having a hard moment? Tap below.</p>
  <button id="btn">Give me a message</button>
<script>
  let last = -1;
  const msg = document.getElementById('msg');
  document.getElementById('btn').onclick = async () => {
    try {
      const r = await fetch('/api/message?last=' + last);
      const d = await r.json();
      last = d.id; msg.textContent = d.message;
    } catch { msg.textContent = "Couldn't load a message. You can still sit with it."; }
  };
</script>
</body>
</html>
